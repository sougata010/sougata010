name: GitHub-Profile-3D-Contrib

on:
  schedule: # 00:00 UTC daily — adjust to your local midnight if you prefer
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5

      # Step A — generates the default variant set:
      # profile-3d-contrib/profile-green.svg, profile-night-rainbow.svg,
      # profile-night-view.svg, profile-gitblock.svg, etc.
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # Step B — generates profile-3d-contrib/profile-custom-theme.svg
      # using conf/github-profile-3d-contrib.json (your cyan/purple palette)
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: conf/github-profile-3d-contrib.json

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "chore: update 3D contribution graphs"; then
            git push
          fi
